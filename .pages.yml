media:
  input: public/uploads
  output: /uploads

content:
  - name: productos
    label: Productos
    type: collection
    path: src/content/productos
    filename: "{fields.nombre}.md"
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true

      - name: descripcion
        label: Descripción
        type: text

      - name: precio
        label: Precio
        type: string
        required: true
        description: "Ingresar sin el signo $ y con puntos para los miles. Ejemplo: 8.500"
        pattern:
          regex: "^[0-9]{1,3}(\\.[0-9]{3})*$"
          message: "Usá el formato 8.500 o 25.999, sin escribir el signo $."

      - name: estado
        label: Estado
        type: select
        options:
          values:
            - Disponible
            - Consultar disponibilidad
            - A pedido
            - Sin stock

      - name: categoria
        label: Categoría
        type: select
        options:
          values:
            - Alimentos
            - Accesorios
            - Juguetes
            - Higiene
            - Medicamentos
            - Otros
      
      - name: resaltar
        label: Resaltar
        type: boolean
        default: false

      - name: imagen
        label: Imagen
        type: image